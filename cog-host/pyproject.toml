[project]
name = "cog-host"
version = "0.1.0"
description = "Local OSINT dashboard for self-audit and contact verification"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "jinja2==3.1.4",
    "python-multipart==0.0.9",
    "httpx==0.27.2",
    "pydantic-settings==2.5.2",
    "phonenumbers==8.13.45",
    "email-validator==2.2.0",
    "dnspython==2.6.1",
    "argon2-cffi==23.1.0",
    "itsdangerous==2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "respx==0.21.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
